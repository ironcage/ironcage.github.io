<style>
/* Layout: arcade cabinet. Menus are stacked "fight cards" on a steel ground; the fight view is canvas + two-cluster pad. Single dark arena look by choice. */
:root{
  --bg:#101318;
  --steel:#1b2028;
  --steel-2:#262d38;
  --line:#3a4352;
  --fg:#e9e6df;
  --muted:#8e97a6;
  --blue:#2f6fd6;
  --blue-t:#7fa9f3;
  --red:#d23a2c;
  --red-t:#ff8b7f;
  --gold:#e8b33a;
  --green:#5fa86b;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;-webkit-tap-highlight-color:transparent}
.app{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.app.wide{max-width:1280px}
body.noscroll{overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,28px);margin:0;line-height:1;cursor:pointer;background:none;border:none;color:var(--fg);padding:0}
.brand b{color:var(--gold);font-weight:400}
.topinfo{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.topinfo strong{color:var(--fg)}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* screens */
.scr{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--steel);border:1px solid var(--line);border-radius:8px;padding-block:16px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2.big{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,52px);margin:0;line-height:1.02;text-wrap:balance}
h2.big .b{color:var(--blue-t)} h2.big .r{color:var(--red-t)} h2.big .g{color:var(--gold)}
h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;line-height:1.2}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;max-width:65ch}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn-go{font-family:var(--display);font-size:21px;padding:14px 18px;border:none;border-radius:6px;background:var(--red);color:#fff;cursor:pointer}
.btn-go:disabled{background:var(--steel-2);color:var(--muted);cursor:default}
.btn-go.blue{background:var(--blue)}
.btn{font-weight:700;font-size:14px;padding:10px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:7px 10px;font-size:13px}
.back{font-weight:700;font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 0;align-self:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:700;font-size:13px;padding:9px 12px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--fg);border-color:var(--gold);background:var(--steel-2)}
.lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],select{font-family:var(--body);font-size:16px;padding:10px 12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* home */
.hero{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#07080b}
.hero canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%}
.heroTxt{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,rgba(7,8,11,.92) 45%)}
@media (max-width:560px){.hero{display:flex;flex-direction:column}.heroTxt{position:static;background:none;padding:12px 4px 4px}}
.hero h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,76px);margin:0;line-height:.95;letter-spacing:-.01em}
.hero h2 span{color:var(--gold)}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-align:left;background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:16px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative;overflow:hidden}
.tile .tn{font-family:var(--display);font-size:26px;line-height:1}
.tile .td{font-size:13px;color:var(--muted);line-height:1.5}
.tile .tx{font-size:12px;color:var(--gold);font-weight:700;margin-top:auto}
.tile.main{grid-column:1/-1;border-color:var(--red);background:linear-gradient(135deg,#2a1a1c,var(--steel) 60%)}
.tile.main .tn{font-size:34px}

/* fighter rows */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{flex:none;font-family:var(--display);font-size:17px;padding:10px 14px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.frow{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--fg);cursor:pointer;position:relative;min-width:0}
.frow canvas.pt{width:40px;height:50px;display:block;border-radius:4px;background:#0b0d11}
.frow .rk{font-family:var(--display);font-size:15px;color:var(--muted);min-width:26px;text-align:center}
.frow .rk.c{color:var(--gold)}
.frow .nm{font-weight:700;font-size:15px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sb{font-size:12px;color:var(--muted)}
.ovr{font-family:var(--display);font-size:20px;min-width:34px;text-align:center;padding:4px 6px;border-radius:4px;background:var(--steel-2)}
.ovr.hi{color:var(--gold)}
.frow.sa{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.frow.sb2{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.frow.me{border-color:var(--gold)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;color:#fff;margin-left:6px;vertical-align:middle}
.tag.a{background:var(--blue)}.tag.b{background:var(--red)}.tag.g{background:#6b5313;color:#ffe9b0}

/* stat bars */
.sbars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:13px}
.sbars .n{color:var(--muted)}
.sbars .v{font-variant-numeric:tabular-nums;font-weight:700;min-width:24px;text-align:right}
.track{height:7px;background:var(--steel-2);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--muted)}
.track i.hi{background:var(--gold)} .track i.mid{background:var(--fg)}

/* tale of the tape */
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center}
.tape .pa{text-align:right}.tape .mid{text-align:center;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.tape .num{font-variant-numeric:tabular-nums;font-weight:700}
.tape .w{color:var(--fg)} .tape .l{color:var(--muted);font-weight:400}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:center;font-size:12px}
.cmp .ta{direction:rtl}
.cmp .track i.a{background:var(--blue)} .cmp .track i.b{background:var(--red)}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.vsrow canvas{width:min(170px,38vw);height:auto;aspect-ratio:150/190;display:block}
.vsrow .va{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px;min-width:0}
.vsrow .vb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.vsrow .nm{font-family:var(--display);font-size:clamp(18px,4.6vw,28px);line-height:1.1}
.vsrow .vs{font-family:var(--display);font-size:22px;color:var(--muted);padding-bottom:40px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.a{color:var(--blue-t);font-weight:700} td.b{color:var(--red-t);font-weight:700}
tr.tot td{border-bottom:none;font-weight:700}
.advice{border-left:3px solid var(--gold);padding:8px 12px;background:var(--bg);font-size:14px;line-height:1.55;color:var(--fg)}

/* career */
.chead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.chead canvas{width:120px;height:auto;aspect-ratio:150/190;border-radius:6px;background:#0b0d11}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);font-weight:700}
.kv b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--steel-2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.act{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.act b{font-family:var(--display);font-weight:400;font-size:18px}
.act span{font-size:12px;color:var(--muted);line-height:1.45}
.act:disabled{opacity:.4;cursor:default}
.offer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}
.offer.title{border-color:var(--gold);background:linear-gradient(135deg,#2a2412,var(--bg) 70%)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.log div{padding:6px 10px;background:var(--bg);border-radius:4px}
.log b{color:var(--fg)}
.achbar{display:flex;flex-direction:column;gap:6px}
.achbar div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:6px;background:linear-gradient(135deg,#3a2c0c,#1b1608);border:1px solid var(--gold)}
.achbar b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold)}
.achbar span{font-size:12px;color:var(--fg)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.achgrid div{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);opacity:.45}
.achgrid div.on{opacity:1;border-color:var(--gold)}
.achgrid b{font-size:13px}.achgrid span{font-size:11px;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg) inset}
.plus{width:30px;height:30px;border-radius:4px;border:1px solid var(--line);background:var(--steel-2);color:var(--fg);font-weight:700;cursor:pointer}
.plus:disabled{opacity:.3}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px;overflow-x:auto}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:150px}
.match{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.match div{padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.match div+div{border-top:1px solid var(--line)}
.match .w{font-weight:700;color:var(--fg)} .match .l{color:var(--muted);text-decoration:line-through}
.match .me{color:var(--gold)}

/* fight view */
[hidden]{display:none!important}
.game{display:flex;flex-direction:column;gap:8px}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gbar .lb{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{position:relative;overflow:hidden;width:100%;max-width:100%;aspect-ratio:16/9;max-height:calc(100dvh - 300px);min-height:220px;border-radius:6px;background:#0b0d11;border:1px solid var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{background:#05060a}
.pad{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:10px;touch-action:none;-webkit-user-select:none;user-select:none}
.cl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;min-width:0}
.cl.l{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:8px}
#guardBtn{min-height:50px;border-top-color:var(--gold)}
.joy{width:100%;flex:1 1 auto;min-height:112px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:10px;background:radial-gradient(circle at 50% 50%,rgba(47,111,214,.08),transparent 70%)}
.joyBase{position:relative;width:min(100%,124px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2a313d,#151a21 70%);border:1px solid var(--line);box-shadow:inset 0 4px 14px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.02)}
.joyBase::before{content:"";position:absolute;inset:22%;border-radius:50%;border:1px dashed rgba(233,230,223,.12)}
.joyKnob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 32%,#5a6475,#2b323e 60%,#1b2028);border:1px solid #4a5466;box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.12);transition:transform .08s ease-out;pointer-events:none}
.joy.on .joyKnob{transition:none;border-color:var(--blue-t)}
.joy.guard .joyKnob{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,179,58,.35),0 6px 14px rgba(0,0,0,.5)}
.joyBase span{position:absolute;font-family:var(--display);color:rgba(233,230,223,.35);font-size:11px;pointer-events:none}
.joyBase .jl{left:9%;top:50%;transform:translateY(-50%)}.joyBase .jr{right:9%;top:50%;transform:translateY(-50%)}
.joyBase .ju{left:50%;top:7%;transform:translateX(-50%)}.joyBase .jdn{left:50%;bottom:7%;transform:translateX(-50%)}
.joy.noMove .joyBase{opacity:.35}
.cl.r{grid-template-rows:repeat(2,1fr)}
.cl.r .pb{min-height:64px;font-size:clamp(14px,3.8vw,19px)}
.pb{font-family:var(--display);font-size:clamp(12px,3.3vw,17px);line-height:1.1;color:var(--fg);background:linear-gradient(var(--steel-2),var(--steel));border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:6px;min-height:46px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;touch-action:none;word-break:keep-all;text-align:center;min-width:0}
.pb small{font-family:var(--body);font-size:10px;color:var(--muted);font-weight:600}

.pb.tg{border-top-color:var(--green)}
.pb.ts{border-top-color:var(--gold)}
.pb.dim{opacity:.32}
.pb.mash{border-top-color:#ffd75e;background:linear-gradient(#3a3222,#241f16);animation:pulse .5s infinite alternate}
.pb.ready{box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(232,179,58,.45)}
.pb.on{transform:translateY(2px);filter:brightness(1.3)}
@keyframes pulse{to{filter:brightness(1.35)}}
.hint{font-size:12px;color:var(--muted);margin:0;text-align:center;line-height:1.5;max-width:none}
.overlay{background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){.pb small,.kbd-only{display:none}.tile{min-height:96px}.stage{aspect-ratio:4/3;max-height:none}}
/* immersive: fills the viewport */
.game.immersive{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);z-index:50;background:#05060a;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.game.immersive .stage{flex:0 1 auto;min-height:0;aspect-ratio:4/5;max-height:64dvh;width:100%;height:auto}
.game.immersive .pad{flex:1 1 auto;align-items:center}
.game.immersive .cl.r .pb{min-height:54px}
.game.immersive .hint{display:none}
.game.walking .pad,.game.walking .hint{visibility:hidden}
.game.immersive.walking .gbar{visibility:hidden}
.game.immersive #between{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,92%);max-height:88%;overflow:auto;z-index:3;box-shadow:0 20px 60px rgba(0,0,0,.6)}
@media (orientation:landscape){
  .game.immersive{display:block;padding:0}
  .game.immersive .stage{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;border:none;border-radius:0}
  .game.immersive .pb.empty{visibility:hidden}
  .game.immersive .gbar{position:absolute;left:0;right:0;top:0;bottom:auto;height:0;transform:none;z-index:4;pointer-events:none}
  .game.immersive .gbar .row{display:block}
  .game.immersive .gbar .btn{position:absolute;pointer-events:auto;top:calc(var(--hu,1px)*19);width:calc(var(--hu,1px)*28);height:calc(var(--hu,1px)*28);min-height:0;min-width:0;padding:0;border-radius:50%;font-size:0;display:flex;align-items:center;justify-content:center}
  .game.immersive #fsBtn{left:calc(50% - var(--hu,1px)*76)}.game.immersive #pauseBtn{left:calc(50% + var(--hu,1px)*48)}
  .game.immersive #fsBtn::before{content:"✕";font-size:calc(var(--hu,1px)*13);font-weight:800}.game.immersive #pauseBtn::before{content:"❚❚";font-size:calc(var(--hu,1px)*10);letter-spacing:-1px}
  .game.immersive .gbar .lb{display:none}

/* ===================== DESIGN SYSTEM v2 — one look for every menu screen ===================== */
:root{--glass:rgba(22,26,34,.72);--glass2:rgba(30,35,46,.6);--rim:rgba(255,255,255,.09);--rimT:rgba(255,255,255,.16);--goldG:linear-gradient(180deg,#ffe7a0,#f0b93a 48%,#c88a14);--r:16px}
html,body{background:#07090d}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(232,179,58,.10),transparent 60%),radial-gradient(900px 500px at 100% 0%,rgba(61,127,240,.08),transparent 60%),radial-gradient(900px 500px at 0% 10%,rgba(224,74,58,.07),transparent 60%),#07090d;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.app{position:relative;z-index:1}
/* header */
.top{position:sticky;top:0;z-index:20;margin:0 -6px;padding:8px 10px;border-radius:14px;background:rgba(10,12,17,.62);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--rim)}
.brand{font-size:24px;letter-spacing:.01em;background:linear-gradient(100deg,#f4f6fa,#9aa3b2 40%,#ffffff 60%,#9aa3b2);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b{background:var(--goldG);-webkit-background-clip:text;background-clip:text;color:transparent}
/* cards */
.panel{position:relative;background:linear-gradient(180deg,rgba(34,40,52,.78),rgba(16,19,26,.86));border:1px solid var(--rim);border-top-color:var(--rimT);border-radius:var(--r);padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,179,58,.55),transparent)}
h2.big{background:linear-gradient(180deg,#ffffff 0%,#d9dee6 55%,#8d96a6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
h2.big .b,h2.big .r,h2.big .g{-webkit-text-fill-color:currentColor}
h2.big .g{color:#f0b93a}h2.big .b{color:#7fa9f3}h2.big .r{color:#ff8b7f}
h3{font-size:21px;color:#fff}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:currentColor;opacity:.8}
p{color:rgba(214,220,230,.72)}
/* buttons */
.btn-go{position:relative;overflow:hidden;border-radius:14px;padding:14px 22px;color:#1a1204;background:var(--goldG);box-shadow:0 0 0 1px rgba(255,240,200,.55) inset,0 -3px 0 rgba(120,70,0,.45) inset,0 10px 26px rgba(232,179,58,.28);transition:transform .12s}
.btn-go:active{transform:translateY(2px) scale(.985)}
.btn-go.blue{color:#fff;background:linear-gradient(180deg,#7fb2ff,#2f6fd6 50%,#1a4594);box-shadow:0 0 0 1px rgba(200,225,255,.45) inset,0 -3px 0 rgba(0,30,90,.5) inset,0 10px 26px rgba(61,127,240,.3)}
.btn-go:disabled{background:rgba(255,255,255,.06);color:rgba(214,220,230,.4);box-shadow:none}
.btn{border-radius:999px;padding:10px 16px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--rimT);color:#f2f4f8;backdrop-filter:blur(8px)}
.btn:active{transform:scale(.97)}
.back{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--rim);color:#d6dbe4}
/* segmented + tabs */
.seg{gap:6px}.seg button{border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.04);border-color:var(--rim)}
.seg button[aria-pressed="true"]{color:#1a1204;background:var(--goldG);border-color:transparent;box-shadow:0 4px 14px rgba(232,179,58,.25)}
.tabs{gap:6px;border-bottom:none;padding:4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--rim)}
.tabs button{border-radius:10px;border-bottom:none;padding:8px 14px;font-size:16px}
.tabs button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(232,179,58,.55),0 0 14px rgba(232,179,58,.18)}
/* inputs */
input[type=text],select{border-radius:12px;background:rgba(0,0,0,.35);border-color:var(--rim)}
/* fighter rows */
.frow{border-radius:14px;background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--rim);transition:transform .12s,border-color .12s}
.frow:hover{transform:translateY(-1px);border-color:rgba(232,179,58,.4)}
.frow canvas.pt{border-radius:10px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.08),rgba(0,0,0,.4))}
.frow .rk{font-size:18px}.frow .rk.c{color:#f0b93a;text-shadow:0 0 10px rgba(232,179,58,.5)}
/* choice cards + offers + tables */
.act,.offer{border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--rim)}
.act.on{border-color:#f0b93a;box-shadow:inset 0 0 0 1px #f0b93a}
.tw table{border-collapse:separate;border-spacing:0;width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--rim)}
.tw th{background:rgba(255,255,255,.06);color:#f0b93a;font-weight:800}
.tw tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.chead canvas{border-radius:14px;background:radial-gradient(circle at 50% 30%,rgba(232,179,58,.18),rgba(0,0,0,.5))}
.advice{border-radius:12px;background:rgba(232,179,58,.06)}
/* ===== v44 broadcast hub (design B) ===== */
body.tabbed .top{display:none}
body.tabbed #scr>.back{display:none}

<script>
/* PWA: offline cache (service worker). Relative path so it works on GitHub Pages sub-folders. */
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(r=>{try{r.update()}catch(e){}}).catch(e=>console.warn('SW 등록 실패',e))});
  /* a new version took over: reload right away unless a fight is running (then reload on the next return to the menu) */
  /* update check: on launch, whenever the app comes back to the screen, and every 2 minutes on the menus.
     A newer build on the server → wipe the caches and reload (waits until the current fight is over). */
  const ICUP={busy:()=>{const g=document.getElementById('game');return g&&!g.hidden},running:false,last:0};
  function icCheck(){if(ICUP.running||Date.now()-ICUP.last<20000)return;ICUP.running=true;ICUP.last=Date.now();
    fetch('./data.js?ts='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=/IC\.VER='(\d+)'/.exec(t),cur=window.IC&&IC.VER;
      if(!(m&&cur&&+m[1]>+cur))return;const tried=JSON.parse(sessionStorage.getItem('icfix')||'{}');if(tried.v===m[1]&&Date.now()-tried.t<60000)return;
      const doit=()=>{sessionStorage.setItem('icfix',JSON.stringify({v:m[1],t:Date.now()}));(window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k!=='iron-cage-fonts').map(k=>caches.delete(k)))):Promise.resolve()).then(()=>navigator.serviceWorker.getRegistration()).then(r=>r&&r.update()).catch(()=>{}).finally(()=>location.reload())};
      if(!ICUP.busy())doit();else{const iv=setInterval(()=>{if(!ICUP.busy()){clearInterval(iv);doit()}},1500)}}).catch(()=>{}).finally(()=>{ICUP.running=false})}
  addEventListener('load',()=>setTimeout(icCheck,1200));
  /* boot watchdog: if the game never started (stuck white screen), drop the service worker + caches and reload once */
  setTimeout(()=>{const scr=document.getElementById('scr');if(window.IC&&IC.VER&&scr&&scr.innerHTML.length>50)return;if(sessionStorage.getItem('icboot'))return;sessionStorage.setItem('icboot','1');
    navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0).catch(()=>{}).finally(()=>location.reload())},8000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ICUP.last=0;icCheck();navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})}});
  addEventListener('focus',()=>icCheck());addEventListener('pageshow',()=>{ICUP.last=0;icCheck()});
  setInterval(()=>{if(document.visibilityState==='visible'&&!ICUP.busy())icCheck()},120000);
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||reloaded)return;const busy=()=>{const g=document.getElementById('game');return g&&!g.hidden};
    const go=()=>{if(reloaded)return;reloaded=true;location.reload()};if(!busy())go();else{const iv=setInterval(()=>{if(!busy()){clearInterval(iv);go()}},1500)}})}
</script>
